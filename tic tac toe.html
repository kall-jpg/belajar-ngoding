<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#1f2937;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    text-align:center;
}

h1{
    margin-bottom:20px;
}

#status{
    margin-bottom:20px;
    font-size:20px;
}

.board{
    display:grid;
    grid-template-columns:repeat(3,100px);
    gap:10px;
    justify-content:center;
}

.cell{
    width:100px;
    height:100px;
    background:#374151;
    border-radius:12px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:48px;
    cursor:pointer;
    transition:.2s;
}

.cell:hover{
    background:#4b5563;
}

button{
    margin-top:20px;
    padding:10px 20px;
    font-size:16px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#3b82f6;
    color:white;
}

button:hover{
    background:#2563eb;
}
</style>
</head>

<body>

<div class="container">
    <h1>Tic Tac Toe</h1>

    <div id="status">Giliran: X</div>

    <div class="board">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
    </div>

    <button onclick="resetGame()">Main Lagi</button>
</div>

<script>
const cells = document.querySelectorAll(".cell");
const statusText = document.getElementById("status");

let currentPlayer = "X";
let gameActive = true;

const winPatterns = [
    [0,1,2],
    [3,4,5],
    [6,7,8],
    [0,3,6],
    [1,4,7],
    [2,5,8],
    [0,4,8],
    [2,4,6]
];

cells.forEach(cell=>{
    cell.addEventListener("click",cellClicked);
});

function cellClicked(){

    if(this.textContent!=="" || !gameActive) return;

    this.textContent=currentPlayer;

    if(checkWinner()){
        statusText.textContent="Pemenang: "+currentPlayer+" 🎉";
        gameActive=false;
        return;
    }

    if([...cells].every(cell=>cell.textContent!="")){
        statusText.textContent="Seri!";
        gameActive=false;
        return;
    }

    currentPlayer=currentPlayer==="X"?"O":"X";
    statusText.textContent="Giliran: "+currentPlayer;
}

function checkWinner(){

    for(let pattern of winPatterns){

        let a=cells[pattern[0]].textContent;
        let b=cells[pattern[1]].textContent;
        let c=cells[pattern[2]].textContent;

        if(a && a===b && b===c){

            cells[pattern[0]].style.background="#22c55e";
            cells[pattern[1]].style.background="#22c55e";
            cells[pattern[2]].style.background="#22c55e";

            return true;
        }
    }

    return false;
}

function resetGame(){

    currentPlayer="X";
    gameActive=true;

    statusText.textContent="Giliran: X";

    cells.forEach(cell=>{
        cell.textContent="";
        cell.style.background="#374151";
    });
}
</script>

</body>
</html>
